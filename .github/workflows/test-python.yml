name: Test (Python)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  group: test-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-scitrera-repo-tools:
    name: Test scitrera-repo-tools (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint with ruff
        run: |
          pip install ruff==0.16.0
          ruff check .
        working-directory: .

      - name: Install
        run: pip install -e ".[test]"
        working-directory: .

      - name: Run tests
        run: python -m pytest -v
        working-directory: .
