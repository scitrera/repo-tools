# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Publish (Python)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: publish-python
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test-scitrera-repo-tools:
    name: Test scitrera-repo-tools (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint with ruff
        run: |
          pip install ruff==0.16.0
          ruff check .
        working-directory: .

      - name: Install
        run: pip install -e ".[test]"
        working-directory: .

      - name: Run tests
        run: python -m pytest -v
        working-directory: .

  verify-tag:
    name: Verify tag matches scitrera-repo-tools version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Verify versions are in sync
        run: uvx --from '.' sync-versions --check --verbose

      - name: Compare tag against versions.yaml
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(uvx --from '.' sync-versions --print-version scitrera-repo-tools)"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the scitrera-repo-tools version declared in versions.yaml ($declared)"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches versions.yaml ($declared)."

  publish-scitrera-repo-tools:
    name: Publish scitrera-repo-tools to PyPI
    runs-on: ubuntu-latest
    needs: [ test-scitrera-repo-tools, verify-tag ]
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rewrite local refs to version pins
        run: uvx --from '.' sync-versions --release

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
        working-directory: .

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-scitrera-repo-tools
          path: ./dist/
          if-no-files-found: error

  github-release:
    name: Attach distributions to GitHub release
    runs-on: ubuntu-latest
    needs: [ publish-scitrera-repo-tools ]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
