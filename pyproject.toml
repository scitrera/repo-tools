[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "scitrera-repo-tools"
version = "0.1.16"
description = "Centralized monorepo version-sync tool driven by versions.yaml."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "scitrera.ai", email = "open-source-team@scitrera.com" },
]
keywords = ["monorepo", "version", "sync", "pyproject", "package.json"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "packaging>=26.2",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
]

[project.scripts]
repo-tools = "scitrera_repo_tools.__main__:main"
sync-versions = "scitrera_repo_tools.version_sync.cli:main"
npm-audit = "scitrera_repo_tools.npm_audit.cli:main"
missing-deps = "scitrera_repo_tools.missing_deps:main"
directory-split = "scitrera_repo_tools.directory_split:main"
generate-ci-gha = "scitrera_repo_tools.ci_gen_gha.cli:main"
compile-protos = "scitrera_repo_tools.compile_protos.cli:main"

[project.urls]
Homepage = "https://github.com/scitrera/repo-tools"
Repository = "https://github.com/scitrera/repo-tools"

[tool.hatch.build.targets.wheel]
packages = ["src/scitrera_repo_tools"]

[tool.ruff.lint]
# Selected explicitly rather than relying on ruff's defaults: 0.16 widened the
# default set, which turns a linter upgrade into hundreds of findings on an
# unrelated PR. Pinning the version alone is not enough — the rule set has to
# be pinned too. These are the rules that were already in effect.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
